name: Update YouTube playlists

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate playlists
        run: python generate.py
      - name: Commit generated playlists
        run: |
          if [ -z "$(git status --porcelain -- playlists)" ]; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists
          git commit -m "chore: update YouTube playlists"
          git push
